name: Github Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to run against (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  PACKAGE_NAME: abremir.CompressorCompare
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          if ! git ls-remote --exit-code --tags \
               "https://x-access-token:${GITHUB_TOKEN}@${REPO_URL#https://}" \
               "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag '$TAG' does not exist in this repository"
            exit 1
          fi
          echo "Tag $TAG found on remote"

      - name: Checkout code at the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11

      - name: Publish Binaries
        run: |
          dotnet publish ./source/${{ env.PACKAGE_NAME }} -c Release -r linux-x64 --self-contained false -o ./publish/linux-x64
          dotnet publish ./source/${{ env.PACKAGE_NAME }} -c Release -r win-x64 --self-contained false -o ./publish/win-x64

      - name: Package Assets
        run: |
          cd ./publish/linux-x64 && zip -r ../../${{ env.PACKAGE_NAME }}-linux-x64.zip . && cd ../..
          cd ./publish/win-x64 && zip -r ../../${{ env.PACKAGE_NAME }}-win-x64.zip . && cd ../..

      - name: Publish Github Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.PACKAGE_NAME }}-linux-x64.zip
            ${{ env.PACKAGE_NAME }}-win-x64.zip
          generate_release_notes: true
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
